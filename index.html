<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta http-equiv="Pragma" content="no-cache">

<title>Influenciadoras Pytave</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-256.png" sizes="256x256" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#FDF1EC; --surface:#FFFFFF; --ink:#263238; --muted:#6B8086; --line:#EADCD2;
  --accent:#2F5D64; --accent-ink:#FFFFFF; --accent-soft:#E3EDEC;
  --band:#F6E9A7; --logo:#3C747A; --coral:#C96A45; --coral-soft:#FCE9DF;
  --ok:#4C7A3F; --ok-soft:#E7EFDA; --warn:#9A6A1E; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE4E1;
  --f-display:"Urbanist","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201F; --surface:#19292A; --ink:#EDF3F1; --muted:#8FB0AC; --line:#294240;
  --accent:#8FC5D9; --accent-ink:#0E2126; --accent-soft:#213D40;
  --band:#2B2A1C; --logo:#8FC5D9; --coral:#F3A98A; --coral-soft:#3A2A20;
  --ok:#B9D08A; --ok-soft:#28301A; --warn:#E9BE6B; --warn-soft:#33280F; --bad:#F07B6E; --bad-soft:#3A1A17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12201F; --surface:#19292A; --ink:#EDF3F1; --muted:#8FB0AC; --line:#294240;
  --accent:#8FC5D9; --accent-ink:#0E2126; --accent-soft:#213D40;
  --band:#2B2A1C; --logo:#8FC5D9; --coral:#F3A98A; --coral-soft:#3A2A20;
  --ok:#B9D08A; --ok-soft:#28301A; --warn:#E9BE6B; --warn-soft:#33280F; --bad:#F07B6E; --bad-soft:#3A1A17;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:1.3rem} h3{font-size:1.02rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line);background:var(--band)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.brand .logo{height:34px;width:auto;color:var(--logo);display:block}
.brand .tag{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:1.02rem;padding-left:12px;border-left:1.5px solid var(--logo)}
main{padding-block:22px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.coupon{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px}
.coupon small{display:block;opacity:.65;font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.coupon .code{font-family:var(--f-num);font-size:28px;font-weight:500;letter-spacing:.04em}
.btn{appearance:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 11px;font-size:.85rem;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{min-height:70px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.f{display:block;margin-bottom:12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.f input,.f textarea,.f select{margin-top:6px;font-size:14px;font-weight:400;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.li a{color:var(--accent);text-decoration:none;font-weight:600;word-break:break-all}
.li time,.li .d{color:var(--muted);font-size:12.5px;white-space:nowrap}
.inflrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.inflrow:hover{border-color:var(--accent)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.acard .t{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.acard .t:hover h3{color:var(--accent)}
.acard .ava{width:46px;height:46px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:0 0 46px;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.lg{width:64px;height:64px;font-size:20px;flex:0 0 64px}
.anos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.anos .chip{appearance:none;font:inherit;font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 13px;cursor:pointer}
.anos .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meses-chips{display:flex;gap:6px;flex-wrap:wrap}
.meses-chips .chip{appearance:none;font:inherit;font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.meses-chips .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acard .t h3{font-size:15px}
.acard .h{color:var(--muted);font-size:12px;margin-top:2px}
.acard .acc{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.acard .acc .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.acard .acc code{font-family:var(--f-num);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;word-break:break-all;display:block;font-size:12px}
.acard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:18px 0 8px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.err{color:var(--bad);font-size:13px;margin:8px 0}
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:var(--r)}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}
.tokenbox{font-family:var(--f-num);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1F2E35;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font:inherit}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

/* ---------------- regras de entrega ---------------- */
function regrasDe(x){return Object.assign({reelsPorMes:2,feedPorMes:0,storiesSeqPorMes:4},x.regras||{})}
function mesesContrato(x){
  let out;
  if(x.inicio&&x.duracaoMeses){
    const ini=x.inicio.slice(0,7);
    out=[];for(let i=0;i<x.duracaoMeses;i++)out.push(addMonthsYM(ini,i));
  }else{
    out=[addMonthsYM(curYM,-1),curYM,addMonthsYM(curYM,1)];
  }
  const curYear=Number(curYM.slice(0,4));
  const fimDez=curYear+1+"-12";
  if(out[out.length-1]<fimDez){
    let m=out[out.length-1];
    while(m<fimDez){m=addMonthsYM(m,1);out.push(m)}

  return out;

function anosMeses(meses){
  const map=new Map();
  for(const m of meses){const y=m.slice(0,4);if(!map.has(y))map.set(y,[]);map.get(y).push(m)}
  return map;

function contaMes(x,ym){const c=(x.conteudo||{})[ym]||{};return{reels:(c.reels||[]).length,feed:(c.feed||[]).length,stories:(c.stories||[]).length}}
function pendenteDe(x,ym){
  const r=regrasDe(x),c=contaMes(x,ym);
  const faltas=[];
  if(r.reelsPorMes>c.reels)faltas.push(plural(r.reelsPorMes-c.reels,"Reels"));
  if(r.storiesSeqPorMes>c.stories)faltas.push(plural(r.storiesSeqPorMes-c.stories,"sequência de Stories","sequências de Stories"));
  if(r.feedPorMes>c.feed)faltas.push(plural(r.feedPorMes-c.feed,"post no feed","posts no feed"));
  return faltas;
}

    if(!snap.exists){S.myInfErr=true;render();return}
    S.myInf={id:snap.id,...snap.data()};

function sheetImportarCompras(x){

  const form=el("form",{},
    el("p",{class:"muted"},"Cole o histórico de pedidos dela, uma compra por linha. Eu procuro a data, o número do pedido e o valor em cada linha."),
    el("label",{class:"f"},"Compras",txt),err,
    el("div",{class:"row"},el("button",{class:"btn primary",type:"submit"},"Importar"),el("button",{class:"btn",type:"button",onclick:()=>sheetInflu(x.id)},"Cancelar")));

    const novas=linhas.map(l=>{
      const dm=l.match(/(\d{2})\/(\d{2})\/(\d{4})|(\d{4})-(\d{2})-(\d{2})/);
      const data=dm?(dm[4]?dm[0]:`${dm[3]}-${dm[2]}-${dm[1]}`):"";
      const vm=l.match(/R?\$?\s*([\d.]+,\d{2})|R?\$?\s*(\d+\.\d{2})/);

      const pm=l.match(/pedido\s*#?\s*([\w-]+)/i);
      let itens=l;
      if(dm)itens=itens.replace(dm[0],"");
      if(vm)itens=itens.replace(vm[0],"");
      if(pm)itens=itens.replace(pm[0],"");
      itens=itens.replace(/^[\s\-·|:]+|[\s\-·|:]+$/g,"").replace(/\s{2,}/g," ").trim();
      return{id:uid(),data,pedido:pm?"Pedido "+pm[1]:"",valor,itens};
    });
    try{
      const compras=[...(x.compras||[]),...novas];
      await influRef(x.id).update({compras});
      toast(plural(novas.length,"compra importada","compras importadas"));sheetInflu(x.id);
    }catch(z){err.textContent="Não deu para importar.";err.hidden=false}
  });
  scrim(el("div",{},el("div",{class:"sh"},el("h2",{},"Importar compras — "+x.nome),el("button",{class:"close",onclick:closeOverlay},"×")),form));
}
