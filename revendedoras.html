<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Revendedoras Pytave</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-256.png" sizes="256x256" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#FBFAF3; --surface:#FFFFFF; --ink:#1F2E35; --muted:#5E7480; --line:#E2E5DA;
  --accent:#4A7385; --accent-ink:#FFFFFF; --accent-soft:#E2EFF5;
  --band:#FFFCCA; --logo:#6D94A5; --coral:#B9584A; --coral-soft:#FBE6E2;
  --ok:#5B6A12; --ok-soft:#EEF2D2; --warn:#9A5A00; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE4E1;
  --f-display:"Urbanist","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11191D; --surface:#19242A; --ink:#EEF3F5; --muted:#93A7B1; --line:#2A3940;
  --accent:#8FB8CA; --accent-ink:#0E171B; --accent-soft:#213640;
  --band:#19242A; --logo:#B8D8E9; --coral:#EAA197; --coral-soft:#3A2420;
  --ok:#CFD88E; --ok-soft:#2A2F17; --warn:#E9A84A; --warn-soft:#33260F; --bad:#F07B6E; --bad-soft:#3A1A17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11191D; --surface:#19242A; --ink:#EEF3F5; --muted:#93A7B1; --line:#2A3940;
  --accent:#8FB8CA; --accent-ink:#0E171B; --accent-soft:#213640;
  --band:#19242A; --logo:#B8D8E9; --coral:#EAA197; --coral-soft:#3A2420;
  --ok:#CFD88E; --ok-soft:#2A2F17; --warn:#E9A84A; --warn-soft:#33260F; --bad:#F07B6E; --bad-soft:#3A1A17;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:1.3rem} h3{font-size:1.02rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line);background:var(--band)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 260px;min-width:0}
.brand .logo{height:40px;width:auto;color:var(--logo);display:block}
.brand .tag{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:1.05rem;padding-left:12px;border-left:1.5px solid var(--logo)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex-basis:100%;margin-top:6px;scrollbar-width:none}
.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
@media (max-width:480px){.tabs a{padding:9px 9px;font-size:.92rem}}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
main{padding-block:24px 64px}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.status{font-size:.85rem;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:500}
.kpi.hi{background:var(--coral-soft)}
.kpi.hi .v{color:var(--coral)}
.kpi small{color:var(--muted);font-size:.78rem}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.fields .span2{grid-column:span 2}
@media (max-width:480px){.fields .span2{grid-column:auto}}
.f{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0}
.f > span{font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chips span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:.88rem;background:var(--bg)}
.chips input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--bg)}
.items td{padding:6px}
.items input{padding:7px 9px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.bar i{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.bar .track{background:var(--accent-soft);border-radius:4px}
details summary{cursor:pointer;font-weight:600}
.big-due{font-family:var(--f-display);font-size:2.4rem;line-height:1.1;color:var(--coral)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.acc{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-size:12.5px;min-width:0}
.acc .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.acc code{font-family:var(--f-num);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;word-break:break-all;display:block;font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:var(--r)}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}
.tokenbox{font-family:var(--f-num);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1F2E35;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font:inherit}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:13px;margin:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px);z-index:60}
@media (max-width:520px){.bar{grid-template-columns:96px 1fr auto}.big-due{font-size:2rem}}
</style>
</head>

  const vendidos={};
  for(const v of S.vendas) if(v.itemKey) vendidos[v.itemKey]=(vendidos[v.itemKey]||0)+1;
  const rows=[];
  for(const n of S.notas.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))
    for(const it of (n.itens||[])){
      const key=`${n.id}:${it.id}`; const vend=vendidos[key]||0; const qtd=Number(it.qtd)||0;
      rows.push({key,nota:n,peca:it.peca,tamanho:it.tamanho||"",valor:Number(it.valor)||0,qtd,vend,resta:Math.max(0,qtd-vend)});

async function importarDadosAntigos(btn){
  btn.disabled=true; btn.textContent="Importando…";
  try{
    await cfgRef.set({comissao:MIGRACAO_INICIAL.comissao},{merge:true});
    for(const r of MIGRACAO_INICIAL.revendedoras){
      const tok=randToken();
      await revRef(tok).set({nome:r.nome,token:tok,criadoEm:new Date().toISOString()});
      for(const n of r.notas){
        // os itens antigos usavam uma chave "notaId:itemId" ligada às vendas — mantemos o mesmo
        // padrão de chave aqui trocando só o id da nota pelo novo id gerado.
        const notaId=uid()+Date.now().toString(36);
        const mapaChave={};
        const itensNovos=n.itens.map(it=>{ mapaChave[it.id]=`${notaId}:${it.id}`; return it; });
        await revRef(tok).collection("notas").doc(notaId).set({numero:n.numero,data:n.data,itens:itensNovos,arquivoUrl:n.arquivoUrl,arquivoNome:n.arquivoNome,criadoEm:Date.now()});
        n._notaId=notaId;
      }
      for(const v of r.vendas){
        const [, itemId] = (v.itemKey||"").split(":");
        const nota=r.notas.find(n=>n.itens.some(i=>i.id===itemId));
        const key = nota ? `${nota._notaId}:${itemId}` : null;
        await revRef(tok).collection("vendas").doc(uid()+Date.now().toString(36)).set({...v,itemKey:key,criadoEm:Date.now()});
      }
    }
    toast("Dados antigos importados.");
  }catch(x){ writeError(x); }
  btn.disabled=false; btn.textContent="Importar dados antigos (Jeniffer)";
}

  const ls=S.revs.slice().sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));

function painelAjustesGeral(){
  const com=el("input",{inputmode:"decimal",value:S.cfg.comissao!=null?String(S.cfg.comissao).replace(".",","):"",placeholder:"Ex.: 30"});
  const err=el("div",{class:"err",hidden:true});
  const form=el("form",{},el("label",{class:"f",style:"max-width:220px"},el("span",{},"Comissão padrão (%)"),com),err,
    el("div",{class:"row"},el("button",{class:"btn primary",type:"submit"},"Salvar")));
  form.addEventListener("submit",async e=>{
    e.preventDefault(); const pctTxt=com.value.trim(); const pct=pctTxt?parseValor(pctTxt):null;
    if(pctTxt&&!(pct>=0&&pct<=100)){err.textContent="Digite entre 0 e 100.";err.hidden=false;return}
    err.hidden=true;
    try{ await cfgRef.set({comissao:pct},{merge:true}); toast("Salvo."); }catch(x){writeError(x)}
  });
  return el("div",{class:"panel"},el("h3",{},"Ajustes gerais"),form);
}
function novaRevendedoraSheet(){
  const nome=el("input",{required:true});
  const err=el("div",{class:"err",hidden:true});
  const form=el("form",{},el("label",{class:"f"},"Nome",nome),err,
    el("div",{class:"row"},el("button",{class:"btn primary",type:"submit"},"Cadastrar"),el("button",{class:"btn",type:"button",onclick:closeOverlay},"Cancelar")));
  form.addEventListener("submit",async e=>{
    e.preventDefault(); if(!nome.value.trim()){err.textContent="Dê um nome.";err.hidden=false;return}
    try{ const id=randToken(); await revRef(id).set({nome:nome.value.trim(),token:id,criadoEm:new Date().toISOString()});
      closeOverlay(); toast("Revendedora cadastrada."); }
    catch(x){err.textContent="Não deu para salvar.";err.hidden=false}
  });
  scrim(el("div",{},el("div",{class:"sh"},el("h2",{},"Nova revendedora"),el("button",{class:"close",onclick:closeOverlay},"×")),form));
  setTimeout(()=>nome.focus(),30);
}
